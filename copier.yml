# ============================================
# Kovasz - Geospatial Data Science Template
# ============================================

# Questions
project_name:
  type: str
  help: Project name (lowercase, hyphens ok)
  default: "{{ _folder_name }}"
  validator: >-
    {% if not project_name | regex_search('^[a-z][a-z0-9-]*$') %}
    Must be lowercase, start with letter, use only letters/numbers/hyphens
    {% endif %}

description:
  type: str
  help: Short project description
  default: ""

author:
  type: str
  help: Author name
  default: ""


# ============================================
# Template settings
# ============================================
_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja

# These paths belong to the project after the initial copy. Exclude them from
# both sides of Copier's update diff, including newly introduced template files.
_exclude:
  - "{% if _copier_operation == 'update' %}/README.md{% endif %}"
  - "{% if _copier_operation == 'update' %}/notebooks/{% endif %}"
  - "{% if _copier_operation == 'update' %}/src/{% endif %}"
  - "{% if _copier_operation == 'update' %}/data/{% endif %}"

_skip_if_exists:
  - "*.ipynb"
  - "data/**"

# ============================================
# Success message
# ============================================
_message_after_copy: |

  ✓ Project '{{ project_name }}' created!
