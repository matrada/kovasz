# ============================================
# Kovasz - Geospatial Data Science Template
# ============================================

# Questions
project_name:
  type: str
  help: Project name (lowercase, hyphens ok)
  default: "{{ _folder_name }}"
  validator: >-
    {% if not project_name | regex_search('^[a-z][a-z0-9-]*$') %}
    Must be lowercase, start with letter, use only letters/numbers/hyphens
    {% endif %}

description:
  type: str
  help: Short project description
  default: ""

author:
  type: str
  help: Author name
  default: ""


# ============================================
# Template settings
# ============================================
_subdirectory: template
_templates_suffix: .jinja

# Skip these patterns
_skip_if_exists:
  - "*.ipynb"
  - "data/**"

# ============================================
# Success message
# ============================================
_message_after_copy: |

  ✓ Project '{{ project_name }}' created!

# Tasks only run on `copier copy`, so `copier update` never re-inits or commits.
_tasks:
  - command: "git init"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv sync"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv run python -m ipykernel install --user --name {{ project_name }} --display-name 'Python ({{ project_name }})'"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv run pre-commit install"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add ."
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git commit -m 'init {{ project_name }} from kovasz template'"
    when: "{{ _copier_operation == 'copy' }}"

_exclude:
  - README.md
